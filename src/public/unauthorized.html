<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unauthorized</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #111827);
        color: #e5e7eb;
        font-family: Inter, system-ui, sans-serif;
      }
      .panel {
        max-width: 520px;
        width: 100%;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 28px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.35);
        padding: 34px 28px;
        text-align: center;
      }
      h1 {
        margin-top: 0;
        font-size: 2.1rem;
        letter-spacing: -0.04em;
      }
      p {
        color: #cbd5e1;
        line-height: 1.7;
      }
      .btn-modern {
        margin-top: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        font-weight: 700;
        border: none;
        border-radius: 14px;
        padding: 0.9rem 1.4rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Access Denied</h1>
      <p>Your session does not permit access to this resource. Please return to the dashboard or log in again.</p>
      <a class="btn-modern" href="/dashboard.html">Back to Dashboard</a>
    </div>
  </body>
</html>
