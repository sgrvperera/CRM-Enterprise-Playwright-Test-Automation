<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer Management</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="layout-grid">
        <aside class="sidebar page-panel">
          <div class="brand-identity">
            <span class="brand-pill"></span>
            <span>CRM Portal</span>
          </div>
          <h2>Workspace</h2>
          <ul class="nav-list">
            <li><a class="nav-link" href="/dashboard.html" data-testid="link-dashboard">Dashboard</a></li>
            <li><a class="nav-link active" href="/users.html" data-testid="link-users">Customers</a></li>
            <li><a class="nav-link" href="/audit.html" data-testid="link-audit">Audit Logs</a></li>
            <li><a class="nav-link" href="/admin.html" data-testid="link-admin">Admin Settings</a></li>
          </ul>
          <div style="margin-top: 24px;">
            <div class="status-pill" data-testid="current-user">Loading…</div>
            <button class="btn-modern btn-secondary" style="width:100%; margin-top: 18px;" data-testid="logout">Logout</button>
          </div>
        </aside>

        <main class="page-panel" style="padding: 28px;">
          <div class="page-title-row">
            <div>
              <h1 class="page-title">Customer management</h1>
              <p class="page-copy">Search, review, and update customer records with enterprise controls and permission awareness.</p>
            </div>
            <button class="btn-modern btn-primary" data-testid="create-btn">Create customer</button>
          </div>

          <div class="toolbar">
            <div class="controls-grid">
              <div class="control-group">
                <label for="search-input">Search</label>
                <input id="search-input" class="input-field" data-testid="search-input" placeholder="Search by name or email" />
              </div>
              <div class="control-group">
                <label for="filter-status">Status</label>
                <select id="filter-status" class="select-field" data-testid="filter-status">
                  <option value="">All statuses</option>
                  <option>Prospect</option>
                  <option>Active</option>
                  <option>Pending</option>
                  <option>Inactive</option>
                  <option>Blocked</option>
                </select>
              </div>
              <div class="control-group">
                <label for="sort-select">Sort by</label>
                <select id="sort-select" class="select-field" data-testid="sort-select">
                  <option value="name">Name</option>
                  <option value="status">Status</option>
                </select>
              </div>
              <div class="control-group" style="align-self:end;">
                <button class="btn-modern btn-secondary" data-testid="search-btn">Apply</button>
              </div>
            </div>
          </div>

          <div class="page-actions" style="justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <button class="btn-modern btn-danger" data-testid="bulk-delete-btn">Bulk delete</button>
            <span data-testid="pagination-info" class="page-copy">Page 1</span>
          </div>

          <div class="table-shell">
            <table class="table-wrapper">
              <thead>
                <tr>
                  <th class="checkbox-cell"><input type="checkbox" data-testid="select-all" /></th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody data-testid="customers-table-body"></tbody>
            </table>
          </div>

          <div class="page-actions" style="justify-content: flex-end; margin-top: 14px;">
            <button class="btn-modern btn-secondary" data-testid="page-prev">Previous</button>
            <button class="btn-modern btn-secondary" data-testid="page-next">Next</button>
          </div>

          <div class="modal-backdrop" data-testid="modal">
            <div class="modal-window">
              <h2 data-testid="modal-title">Create customer</h2>
              <div class="modal-row">
                <div class="control-group">
                  <label class="form-label" for="field-name">Name</label>
                  <input id="field-name" class="input-field" data-testid="field-name" />
                </div>
                <div class="control-group">
                  <label class="form-label" for="field-email">Email</label>
                  <input id="field-email" class="input-field" data-testid="field-email" />
                </div>
                <div class="control-group">
                  <label class="form-label" for="field-status">Status</label>
                  <select id="field-status" class="select-field" data-testid="field-status"></select>
                </div>
                <div class="form-error" data-testid="form-error"></div>
                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:12px;">
                  <button class="btn-modern btn-primary" data-testid="modal-save">Save details</button>
                  <button class="btn-modern btn-secondary" data-testid="modal-cancel">Cancel</button>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="/assets/common.js"></script>
    <script src="/assets/users.js"></script>
  </body>
</html>
