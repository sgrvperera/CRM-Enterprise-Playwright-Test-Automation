<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Customers</title>
    <style>
      body {
        font-family: Arial;
        padding: 24px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      td,
      th {
        border: 1px solid #ddd;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container" style="margin-top: 24px">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Customers</h1>
        <div>
          <input
            class="form-control d-inline-block me-2"
            style="width: 260px"
            data-testid="search-input"
            placeholder="Search"
          />
          <button class="btn btn-secondary me-2" data-testid="search-btn">Search</button>
          <button class="btn btn-primary" data-testid="create-btn">Create Customer</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped" data-testid="customers-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div
        id="modal"
        class="card p-3 shadow-sm"
        style="display: none; max-width: 560px"
        data-testid="modal"
      >
        <h3 data-testid="modal-title">Create</h3>
        <div class="mb-2">
          <label class="form-label">Name</label>
          <input class="form-control" data-testid="field-name" />
        </div>
        <div class="mb-2">
          <label class="form-label">Email</label>
          <input class="form-control" data-testid="field-email" />
        </div>
        <div class="mb-2">
          <label class="form-label">Status</label>
          <select class="form-select" data-testid="field-status">
            <option>Prospect</option>
            <option>Active</option>
          </select>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" data-testid="modal-save">Save</button>
          <button class="btn btn-secondary" data-testid="modal-cancel">Cancel</button>
        </div>
      </div>

      <p class="mt-3"><a href="/dashboard.html">Back to dashboard</a></p>
    </div>

    <script>
      const tableBody = document.querySelector('tbody');
      const modal = document.getElementById('modal');
      let editingId = null;

      async function load(q = '') {
        const token = localStorage.getItem('token');
        if (!token) return (location.href = '/');
        const res = await fetch('/api/customers?q=' + encodeURIComponent(q), {
          headers: { Authorization: 'Bearer ' + token },
        });
        if (!res.ok) return alert('Failed to load');
        const list = await res.json();
        tableBody.innerHTML = '';
        list.forEach((c) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${c.name}</td><td>${c.email}</td><td>${c.status}</td><td><button data-id="${c.id}" class="edit">Edit</button> <button data-id="${c.id}" class="del">Delete</button></td>`;
          tableBody.appendChild(tr);
        });
        Array.from(document.querySelectorAll('.edit')).forEach((b) =>
          b.addEventListener('click', async (e) => {
            const id = e.target.dataset.id;
            const token = localStorage.getItem('token');
            const res = await fetch('/api/customers', {
              headers: { Authorization: 'Bearer ' + token },
            });
            // load from existing list
            const list = await res.json();
            const c = list.find((x) => x.id === id);
            editingId = id;
            modal.style.display = 'block';
            document.querySelector('[data-testid="modal-title"]').textContent = 'Edit Customer';
            document.querySelector('[data-testid="field-name"]').value = c.name;
            document.querySelector('[data-testid="field-email"]').value = c.email;
            document.querySelector('[data-testid="field-status"]').value = c.status;
          })
        );
        Array.from(document.querySelectorAll('.del')).forEach((b) =>
          b.addEventListener('click', async (e) => {
            if (!confirm('Delete?')) return;
            const id = e.target.dataset.id;
            const token = localStorage.getItem('token');
            await fetch('/api/customers/' + id, {
              method: 'DELETE',
              headers: { Authorization: 'Bearer ' + token },
            });
            load();
          })
        );
      }

      document.querySelector('[data-testid="search-btn"]').addEventListener('click', () => {
        const q = document.querySelector('[data-testid="search-input"]').value;
        load(q);
      });
      document.querySelector('[data-testid="create-btn"]').addEventListener('click', () => {
        editingId = null;
        modal.style.display = 'block';
        document.querySelector('[data-testid="modal-title"]').textContent = 'Create Customer';
        document.querySelector('[data-testid="field-name"]').value = '';
        document.querySelector('[data-testid="field-email"]').value = '';
      });
      document.querySelector('[data-testid="modal-cancel"]').addEventListener('click', () => {
        modal.style.display = 'none';
      });
      document.querySelector('[data-testid="modal-save"]').addEventListener('click', async () => {
        const token = localStorage.getItem('token');
        const name = document.querySelector('[data-testid="field-name"]').value;
        const email = document.querySelector('[data-testid="field-email"]').value;
        const status = document.querySelector('[data-testid="field-status"]').value;
        if (!name || !email) {
          alert('Validation');
          return;
        }
        if (editingId) {
          await fetch('/api/customers/' + editingId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ name, email, status }),
          });
        } else {
          await fetch('/api/customers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ name, email, status }),
          });
        }
        modal.style.display = 'none';
        load();
      });

      load();
    </script>
  </body>
</html>
