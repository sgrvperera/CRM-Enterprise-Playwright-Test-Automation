<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customers</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #111827;
        --panel: rgba(255, 255, 255, 0.08);
        --panel-border: rgba(255, 255, 255, 0.14);
        --text-main: #e5e7eb;
        --text-soft: #94a3b8;
        --primary: #6366f1;
        --danger: #ef4444;
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--text-main);
        background:
          radial-gradient(circle at top left, rgba(99, 102, 241, 0.22), transparent 30%),
          radial-gradient(circle at top right, rgba(139, 92, 246, 0.18), transparent 28%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        min-height: 100vh;
      }

      .page-shell {
        padding: 28px 18px;
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
      }

      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 22px 24px;
        border-radius: 24px;
        border: 1px solid var(--panel-border);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
        margin-bottom: 18px;
      }

      .header-bar h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .form-control {
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(15, 23, 42, 0.4);
        color: #fff;
        padding: 0.65rem 0.9rem;
      }

      .form-control:focus {
        border-color: rgba(99, 102, 241, 0.8);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        background: rgba(15, 23, 42, 0.55);
        color: #fff;
      }

      .btn-modern {
        border: 0;
        border-radius: 14px;
        padding: 0.65rem 1rem;
        font-weight: 700;
        transition: 0.2s ease;
      }

      .btn-modern:hover {
        transform: translateY(-1px);
      }

      .btn-primary-modern {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff;
      }

      .btn-secondary-modern {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .btn-secondary-modern:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }

      .table-wrap {
        border-radius: 24px;
        overflow: hidden;
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        color: #e5e7eb;
      }

      thead {
        background: rgba(255, 255, 255, 0.06);
      }

      th,
      td {
        padding: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      tr:hover td {
        background: rgba(255, 255, 255, 0.04);
      }

      .action-btn {
        border: 0;
        padding: 6px 10px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.85rem;
        margin-right: 6px;
        cursor: pointer;
      }

      .edit-btn {
        background: rgba(99, 102, 241, 0.2);
        color: #c7d2fe;
      }

      .delete-btn {
        background: rgba(239, 68, 68, 0.2);
        color: #fecaca;
      }

      /* MODAL */
      #modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(6px);
        z-index: 999;
      }

      .modal-box {
        width: 100%;
        max-width: 520px;
        border-radius: 24px;
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
        box-shadow: var(--shadow);
      }

      .modal-box h3 {
        margin-top: 0;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .form-label {
        font-weight: 600;
        margin-bottom: 6px;
      }

      .form-select {
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.4);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      .form-select:focus {
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      }

      .back-link {
        display: inline-block;
        margin-top: 16px;
        color: #c7d2fe;
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="page-shell">
      <div class="wrap">
        <div class="header-bar">
          <h1>Customers</h1>

          <div class="controls">
            <input
              class="form-control d-inline-block"
              style="width: 260px"
              data-testid="search-input"
              placeholder="Search"
            />
            <button class="btn-modern btn-secondary-modern" data-testid="search-btn">
              Search
            </button>
            <button class="btn-modern btn-primary-modern" data-testid="create-btn">
              Create Customer
            </button>
          </div>
        </div>

        <div class="table-wrap">
          <table data-testid="customers-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div id="modal" data-testid="modal">
          <div class="modal-box">
            <h3 data-testid="modal-title">Create</h3>

            <div class="mb-2">
              <label class="form-label">Name</label>
              <input class="form-control" data-testid="field-name" />
            </div>

            <div class="mb-2">
              <label class="form-label">Email</label>
              <input class="form-control" data-testid="field-email" />
            </div>

            <div class="mb-3">
              <label class="form-label">Status</label>
              <select class="form-select" data-testid="field-status">
                <option>Prospect</option>
                <option>Active</option>
              </select>
            </div>

            <div class="mb-3">
              <div id="form-error" data-testid="form-error" style="color:#f87171;min-height:1.2em"></div>
            </div>
            <div class="d-flex gap-2">
              <button class="btn-modern btn-primary-modern" data-testid="modal-save">
                Save
              </button>
              <button class="btn-modern btn-secondary-modern" data-testid="modal-cancel">
                Cancel
              </button>
            </div>
          </div>
        </div>

        <p>
          <a class="back-link" href="/dashboard.html">← Back to dashboard</a>
        </p>
      </div>
    </div>

    <script>
      const tableBody = document.querySelector('tbody');
      const modal = document.getElementById('modal');
      let editingId = null;

      async function load(q = '') {
        const token = localStorage.getItem('token');
        if (!token) return (location.href = '/');

        const res = await fetch('/api/customers?q=' + encodeURIComponent(q), {
          headers: { Authorization: 'Bearer ' + token },
        });

        if (!res.ok) {
          if (res.status === 401 || res.status === 403) return (location.href = '/unauthorized.html');
          return alert('Failed to load');
        }

        const payload = await res.json();
        const list = payload.data || [];
        tableBody.innerHTML = '';

        list.forEach((c) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${c.name}</td>
            <td>${c.email}</td>
            <td>${c.status}</td>
            <td>
              <button data-id="${c.id}" class="edit action-btn edit-btn">Edit</button>
              <button data-id="${c.id}" class="del action-btn delete-btn">Delete</button>
            </td>`;
          tableBody.appendChild(tr);
        });

        Array.from(document.querySelectorAll('.edit')).forEach((b) =>
          b.addEventListener('click', async (e) => {
            const id = e.target.dataset.id;
            const token = localStorage.getItem('token');
            const res = await fetch('/api/customers', {
              headers: { Authorization: 'Bearer ' + token },
            });
            if (!res.ok) {
              if (res.status === 401 || res.status === 403) return (location.href = '/unauthorized.html');
              return alert('Unable to load customer details.');
            }

            const payload = await res.json();
            const customer = (payload.data || []).find((x) => x.id === id);
            if (!customer) {
              return alert('Customer not found.');
            }

            editingId = id;
            modal.style.display = 'flex';

            document.querySelector('[data-testid="modal-title"]').textContent = 'Edit Customer';
            document.querySelector('[data-testid="field-name"]').value = customer.name;
            document.querySelector('[data-testid="field-email"]').value = customer.email;
            document.querySelector('[data-testid="field-status"]').value = customer.status;
          })
        );

        Array.from(document.querySelectorAll('.del')).forEach((b) =>
          b.addEventListener('click', async (e) => {
            if (!confirm('Delete?')) return;
            const id = e.target.dataset.id;
            const token = localStorage.getItem('token');

            const response = await fetch('/api/customers/' + id, {
              method: 'DELETE',
              headers: { Authorization: 'Bearer ' + token },
            });
            if (!response.ok) {
              if (response.status === 401 || response.status === 403) return (location.href = '/unauthorized.html');
              return alert('Failed to delete customer.');
            }

            load();
          })
        );
      }

      document.querySelector('[data-testid="search-btn"]').addEventListener('click', () => {
        const q = document.querySelector('[data-testid="search-input"]').value;
        load(q);
      });

      document.querySelector('[data-testid="create-btn"]').addEventListener('click', () => {
        editingId = null;
        modal.style.display = 'flex';

        document.querySelector('[data-testid="modal-title"]').textContent = 'Create Customer';
        document.querySelector('[data-testid="field-name"]').value = '';
        document.querySelector('[data-testid="field-email"]').value = '';
        document.querySelector('[data-testid="field-status"]').value = 'Prospect';
      });

      document.querySelector('[data-testid="modal-cancel"]').addEventListener('click', () => {
        modal.style.display = 'none';
      });

      document.querySelector('[data-testid="modal-save"]').addEventListener('click', async () => {
        const token = localStorage.getItem('token');
        const name = document.querySelector('[data-testid="field-name"]').value;
        const email = document.querySelector('[data-testid="field-email"]').value;
        const status = document.querySelector('[data-testid="field-status"]').value;
        const errorElement = document.querySelector('[data-testid="form-error"]');

        errorElement.textContent = '';
        if (!name || !email) {
          errorElement.textContent = 'Name and email are required.';
          return;
        }

        const url = editingId ? '/api/customers/' + editingId : '/api/customers';
        const method = editingId ? 'PUT' : 'POST';

        const response = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token,
          },
          body: JSON.stringify({ name, email, status }),
        });

        if (!response.ok) {
          if (response.status === 401) {
            return (location.href = '/unauthorized.html');
          }
          const body = await response.json().catch(() => ({}));
          errorElement.textContent = body.error || 'Unable to save customer.';
          return;
        }

        modal.style.display = 'none';
        load();
      });

      load();
    </script>
  </body>
</html>
