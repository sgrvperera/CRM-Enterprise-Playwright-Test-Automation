<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Settings</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a, #111827);
        color: #e5e7eb;
        font-family: Inter, system-ui, sans-serif;
      }
      .page-shell {
        max-width: 980px;
        margin: 0 auto;
        padding: 36px 24px;
      }
      .card {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.25);
        padding: 28px;
      }
      .title {
        margin: 0 0 8px;
        font-size: clamp(1.75rem, 2.5vw, 2.4rem);
      }
      .subtitle {
        margin: 0 0 24px;
        color: #94a3b8;
      }
      .list-group {
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .list-group li {
        display: flex;
        justify-content: space-between;
        padding: 18px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .list-group li:last-child {
        border-bottom: none;
      }
      .status {
        color: #cbd5e1;
      }
      .back-link {
        display: inline-block;
        margin-top: 24px;
        color: #c7d2fe;
        text-decoration: none;
      }
      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="card">
        <h1 class="title">Admin Settings</h1>
        <p class="subtitle">Review role-based access, session management, and security controls for the enterprise portal.</p>
        <ul class="list-group">
          <li>
            <span>Role-based auditing</span>
            <span class="status">Enabled</span>
          </li>
          <li>
            <span>Session expiry</span>
            <span class="status">30 minutes</span>
          </li>
          <li>
            <span>Customer data retention</span>
            <span class="status">90 days</span>
          </li>
          <li>
            <span>API rate limiting</span>
            <span class="status">150 requests / min</span>
          </li>
        </ul>
        <a class="back-link" href="/dashboard.html">← Back to Dashboard</a>
      </div>
    </div>
  </body>
</html>
