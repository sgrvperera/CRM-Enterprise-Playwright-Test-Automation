<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CRM Portal - Login</title>
    <style>
      body {
        font-family: Arial;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div class="container" style="max-width: 480px; margin-top: 48px">
      <div class="card shadow-sm p-4">
        <h2 class="mb-3">CRM Portal</h2>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              class="form-control"
              data-testid="login-email"
              name="email"
              value="admin@example.com"
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input
              class="form-control"
              data-testid="login-password"
              name="password"
              type="password"
              value="Admin123!"
            />
          </div>
          <div class="d-grid">
            <button class="btn btn-primary" data-testid="login-submit">Sign in</button>
          </div>
        </form>
        <div id="message" data-testid="login-message" class="text-danger mt-3"></div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity=""
      crossorigin="anonymous"
    ></script>
    <script>
      const form = document.getElementById('loginForm');
      const msg = document.getElementById('message');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        const fd = new FormData(form);
        const email = fd.get('email');
        const password = fd.get('password');
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          if (!res.ok) {
            const err = await res.json();
            msg.textContent = err.error || 'Login failed';
            return;
          }
          const { token } = await res.json();
          localStorage.setItem('token', token);
          location.href = '/dashboard.html';
        } catch (e) {
          msg.textContent = 'Network error';
        }
      });
    </script>
  </body>
</html>
