<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CRM Dashboard</title>
    <style>
      body {
        font-family: Arial;
        padding: 24px;
      }
      .card {
        display: inline-block;
        padding: 12px;
        border: 1px solid #ddd;
        margin: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container" style="margin-top: 24px">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Dashboard</h1>
        <div>
          <a class="btn btn-outline-secondary me-2" href="/users.html" data-testid="link-users"
            >Manage Customers</a
          >
          <button class="btn btn-danger" data-testid="logout">Logout</button>
        </div>
      </div>

      <div class="row g-3" id="cards">
        <div class="col-md-4">
          <div class="card p-3 shadow-sm" data-testid="card-customers">
            <div class="h5">Customers</div>
            <div class="fs-3" id="count">0</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3 shadow-sm" data-testid="card-activity">
            <div class="h5">Recent activity</div>
            <div class="fs-3">5</div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity=""
      crossorigin="anonymous"
    ></script>
    <script>
      async function load() {
        const token = localStorage.getItem('token');
        if (!token) return (location.href = '/');
        const res = await fetch('/api/customers', {
          headers: { Authorization: 'Bearer ' + token },
        });
        if (!res.ok) return (location.href = '/');
        const list = await res.json();
        document.getElementById('count').textContent = list.length;
      }
      document.querySelector('[data-testid="logout"]').addEventListener('click', () => {
        localStorage.removeItem('token');
        location.href = '/';
      });
      load();
    </script>
  </body>
</html>
